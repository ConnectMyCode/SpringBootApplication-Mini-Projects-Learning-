# ================= PRODUCTION PROFILE =================
# NAMING NOTE: Spring Boot's profile mechanism only auto-loads a file
# named EXACTLY "application-{profileName}application.properties" - the profile name
# comes AFTER "application-". This file is named "application-prod.properties",
# not "prod-application.properties" - that reversed name would be
# silently ignored by Spring Boot.
# Activated by setting SPRING_PROFILES_ACTIVE=prod (see prod.env.example).
# When active, these properties OVERRIDE the same-named ones in
# application.properties; anything not redefined here still comes from there.

# NO DEFAULT VALUES ON PURPOSE (unlike application.properties' ${VAR:default}
# pattern). If DB_HOST/DB_USERNAME/DB_PASSWORD aren't set as real
# environment variables in production, the app FAILS TO START with a
# clear error - a loud failure at startup, not a silent wrong connection.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "validate" instead of "update" - schema is expected to already be
# correct (via a migration tool or created once, not auto-altered).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}

logging.level.root=WARN
logging.level.com.learning.fitclub=INFO
server.error.include-message=never
server.error.include-stacktrace=never
