spring.config.import=optional:file:.env[.properties]
spring.application.name=Spring14-fitclub-mvc

# ================= MySQL configuration (DEV defaults, via env vars) =================
# Every value below is ${ENV_VAR:default} - if the environment variable
# isn't set, it falls back to a safe LOCAL DEVELOPMENT default so you can
# just run this app on your own machine without configuring anything.
# DB_HOST defaults to "localhost" for the same reason. When running via
# docker-compose, DB_HOST gets overridden to "mysql" - the SERVICE NAME
# from docker-compose.yml, which Docker's internal DNS resolves to the
# database container's IP. Containers can't reach each other via
# "localhost" - each container has its OWN localhost.
# See application-prod.properties for the PRODUCTION version, which
# deliberately has NO fallback defaults.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT}
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG