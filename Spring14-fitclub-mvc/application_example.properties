# ================= REFERENCE / DOCUMENTATION FILE =================
# Named "application_example.properties" ON PURPOSE - Spring Boot ONLY
# auto-loads files named exactly "application.properties" or
# "application-{profile}.properties". This file is IGNORED by the
# running app entirely - it exists purely as documentation of every
# property this project uses, in one place.

spring.application.name=fitclub-mvc

# spring.datasource.* - ${VAR:default} syntax reads an environment
# variable, falling back to the :default if unset. This is what makes ONE
# application.properties file work correctly across three environments
# without editing it: your laptop (defaults), docker-compose (.env), AWS
# (its own config mechanism - see prod.env.example).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fitclub_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto: "update" (dev, convenient but risky in prod) vs "validate"
# (prod, never changes schema, just checks entities match it).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}
